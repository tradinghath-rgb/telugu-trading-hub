services:
  - type: web
    name: telugu-trading-hub
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RAZORPAY_URL
        value: https://rzp.io/rzp/2a3h6cU
